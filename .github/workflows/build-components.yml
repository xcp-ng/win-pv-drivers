name: build-components

on:
  workflow_call:
    inputs:
      environment:
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - Dev
          - Prod
        default: Dev

permissions:
  contents: read

jobs:
  build-components:
    runs-on: windows-latest
    environment:
      name: ${{inputs.environment}}
      deployment: false
    env:
      WINPV_OUTPUT: components/x64/Release
      WINPV_CATALOG: catalog.csv
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download WiX
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $Env:WIX_ZIP_URI -OutFile $Env:RUNNER_TEMP\wix.zip
          if ((Get-FileHash $Env:RUNNER_TEMP\wix.zip).Hash -ine $Env:WIX_ZIP_SHA256) {
            throw "wix.zip failed verification"
          }
          Expand-Archive -Path $Env:RUNNER_TEMP\wix.zip -DestinationPath .\deps\wix\ -Force
        env:
          WIX_ZIP_URI: https://github.com/xcp-ng/wix-builder/releases/download/v7.0.0-xcpng.4/wix.zip
          WIX_ZIP_SHA256: 08ded9b5c6da4dd8ae269a70f06b31af136e13cca3003825d7fb052b72157ef0
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Configure branding
        uses: ./.github/actions/branding
        with:
          branding-data: ${{toJson(vars)}}
      - name: Build components
        run: .\build-components.ps1 -Configuration Release -Platform x64
      - name: Catalog components
        run: |
          Import-Module .\scripts\artifact.psm1 -Force
          Get-ArtifactCatalog -Path .\$Env:WINPV_OUTPUT -Include *.dll, *.exe |
          Export-Csv -NoTypeInformation .\$Env:WINPV_OUTPUT\$Env:WINPV_CATALOG
      - name: Upload components
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: components
          path: ${{env.WINPV_OUTPUT}}/
    outputs:
      output-path: ${{env.WINPV_OUTPUT}}
      output-sha256: ${{steps.upload.outputs.artifact-digest}}
      catalog-name: ${{env.WINPV_CATALOG}}
