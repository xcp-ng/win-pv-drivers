name: build-attested

on:
  workflow_call:
    inputs:
      environment:
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - Dev
          - Prod
        default: Dev

permissions:
  contents: read

jobs:
  build-drivers:
    uses: ./.github/workflows/build-drivers.yml
    with:
      environment: ${{inputs.environment}}
  build-xenplus:
    uses: ./.github/workflows/build-xenplus.yml
    with:
      environment: ${{inputs.environment}}
  build-timeprovider:
    uses: ./.github/workflows/build-timeprovider.yml
    with:
      environment: ${{inputs.environment}}
  build-xstdvga:
    uses: ./.github/workflows/build-xstdvga.yml
    with:
      environment: ${{inputs.environment}}
  build-components:
    uses: ./.github/workflows/build-components.yml
    with:
      environment: ${{inputs.environment}}
  build-attested:
    if: ${{inputs.environment == 'Prod'}}
    runs-on: ubuntu-latest
    needs:
      - build-drivers
      - build-xenplus
      - build-timeprovider
      - build-xstdvga
      - build-components
    permissions:
      id-token: write
      contents: read
      attestations: write
    environment:
      name: ${{inputs.environment}}
      deployment: false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .
          pattern: "{drivers,xenplus,timeprovider,xstdvga,components}"
          merge-multiple: true
          skip-decompress: true
      - name: Attest artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            drivers.zip
            xenplus.zip
            timeprovider.zip
            xstdvga.zip
            components.zip
