name: build-installer

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - Dev
          - Prod
        default: Dev

permissions:
  contents: read

jobs:
  build-attested:
    uses: ./.github/workflows/build-attested.yml
    with:
      environment: ${{inputs.environment}}
    permissions:
      id-token: write
      contents: read
      attestations: write
  build-installer:
    needs:
      - build-attested
    runs-on: windows-latest
    environment:
      name: ${{inputs.environment}}
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup WiX
        uses: ./.github/actions/setup-wix
      - name: Setup SBOM tool
        uses: ./.github/actions/setup-sbom
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Configure branding
        uses: ./.github/actions/branding
        with:
          branding-data: ${{toJson(vars)}}
      - name: Configure test signer
        run: .\scripts\signer-ci.ps1 -OutFile .\branding.ps1
        env:
          SIGNER_PFX_BASE64: ${{secrets.SIGNER_PFX_BASE64}}
      - name: Download prebuilt artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: input
          pattern: "{drivers,xenplus,xstdvga,components}"
          merge-multiple: true
          skip-decompress: true
      - name: Stage prebuilt artifacts
        run: .\scripts\stage-prebuilt.ps1 -Configuration Release -Platform x64 -SignDrivers -SignXenplus -SignXstdvga -SignComponents
      - name: Build installer
        id: build
        # this workflow is always testsigned, so -ExportCertificate is appropriate
        run: .\build-installer.ps1 -Configuration Release -Platform x64 -ExportSymbols -ExportExtras -ExportCertificate -Sbom
      - name: Clean up certificates
        if: always()
        run: Remove-Item Cert:\CurrentUser\My\* -ErrorAction SilentlyContinue
      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: output/
          name: installer-testsigned
