version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "actions: "
    groups:
      ci-deps:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "WixToolset.*"
